<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      as="image"
      imagesrcset="/images/hero-farmland-clean-640.webp 640w, /images/hero-farmland-clean-1280.webp 1280w, /images/hero-farmland-clean-1376.webp 1376w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <title>Claude Template</title>
    <script>
      // Cellutech is dark-first: dark unless the user explicitly chose light.
      if (localStorage.getItem('theme') !== 'light') {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
