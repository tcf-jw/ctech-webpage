<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      as="image"
      imagesrcset="%BASE_URL%images/hero-farmland-clean-640.webp 640w, %BASE_URL%images/hero-farmland-clean-1280.webp 1280w, %BASE_URL%images/hero-farmland-clean-1376.webp 1376w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <title>Cellutech — Intelligence Beneath Every Hectare</title>
    <meta
      name="description"
      content="AI-powered soil intelligence combining chemistry, microbiology and spatial analytics to deliver evidence-based recommendations for Australian landscapes."
    />
    <meta name="theme-color" content="#081118" />
    <meta property="og:title" content="Cellutech — Intelligence Beneath Every Hectare" />
    <meta
      property="og:description"
      content="AI-powered soil intelligence combining chemistry, microbiology and spatial analytics to deliver evidence-based recommendations for Australian landscapes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%images/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Cellutech",
        "description": "AI-powered soil intelligence platform combining chemistry, microbiology and spatial analytics for agriculture, mining rehabilitation and environmental restoration.",
        "areaServed": "AU",
        "logo": "%BASE_URL%favicon.svg"
      }
    </script>
    <script>
      // Cellutech is dark-first: dark unless the user explicitly chose
      // light. Storage access can throw in sandboxed iframes and private
      // browsing - any failure falls back to dark.
      var theme = null
      try {
        theme = localStorage.getItem('theme')
      } catch (e) {}
      if (theme !== 'light') {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
